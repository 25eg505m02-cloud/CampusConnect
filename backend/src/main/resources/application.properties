spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
server.error.include-message=never

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campus_connect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
campus-connect.jwt.secret=${JWT_SECRET}
campus-connect.jwt.expiration=PT24H
campus-connect.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://campus-connect-lilac-three.vercel.app,https://campus-connect-19tpl8jvr-25eg505m02-cloud.vercel.app}
campus-connect.resources.storage-directory=${RESOURCE_STORAGE_DIRECTORY:./uploads}
campus-connect.seed.enabled=${CAMPUS_CONNECT_SEED_ENABLED:false}
campus-connect.seed.directory=${CAMPUS_CONNECT_SEED_DIRECTORY:../collections}
